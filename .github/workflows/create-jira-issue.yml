name: Create Jira Issue(task)
on:
  issues:
    types:
      - opened
jobs:
  create-issue:
    name: Create Jira issue
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Login
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      - name: Checkout develop code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Issue Parser
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/task-issue-form.yml

      - name: Log Issue Parser
        run: |
          echo "branchType = ${{ steps.issue-parser.outputs.issueparser_branchType }}"
          echo "branchName = ${{ steps.issue-parser.outputs.issueparser_branchName }}"
          echo "epicKey = ${{ steps.issue-parser.outputs.issueparser_epicKey }}"
          echo "description = ${{ steps.issue-parser.outputs.issueparser_description }}"
          echo "tasks = ${{ steps.issue-parser.outputs.issueparser_tasks }}"
          echo "json = ${{ steps.issue-parser.outputs.jsonString }}"

      - name: Convert markdown to Jira Syntax
        uses: peter-evans/jira2md@v1
        id: md2jira
        with:
          input-text: |
            ### Github Issue Link
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          mode: md2jira

      - name: Create Issue (with Epic parent)
        id: create-with-parent
        if: ${{ steps.issue-parser.outputs.issueparser_epicKey != '' }}
        uses: atlassian/gajira-create@v3
        with:
          project: BC
          issuetype: Task
          summary: '${{ github.event.issue.title }}'
          description: '${{ steps.md2jira.outputs.output-text }}'
          fields: >-
            {"parent":{"key":"${{ steps.issue-parser.outputs.issueparser_epicKey }}" }}

      - name: Create Issue
        id: create
        if: ${{ steps.issue-parser.outputs.issueparser_epicKey == '' }}
        uses: atlassian/gajira-create@v3
        with:
          project: BC
          issuetype: Task
          summary: '${{ github.event.issue.title }}'
          description: '${{ steps.md2jira.outputs.output-text }}'

      - name: Resolve created issue key
        id: resolve-issue-key
        run: |
          if [ -n "${{ steps.create-with-parent.outputs.issue }}" ]; then
            echo "ISSUE_KEY=${{ steps.create-with-parent.outputs.issue }}" >> $GITHUB_OUTPUT
          else
            echo "ISSUE_KEY=${{ steps.create.outputs.issue }}" >> $GITHUB_OUTPUT
          fi

      - name: Log created issue
        run: echo "Jira Issue ${{ steps.resolve-issue-key.outputs.ISSUE_KEY }} was created"

      - name: Create branch with Ticket number
        run: |
          ISSUE_NUMBER="${{ steps.resolve-issue-key.outputs.ISSUE_KEY }}"
          BRANCH_TYPE="${{ steps.issue-parser.outputs.issueparser_branchType }}"
          BRANCH_NAME_RAW="${{ steps.issue-parser.outputs.issueparser_branchName }}"

          LOWER_CASE_NAME=$(echo "${BRANCH_NAME_RAW}" | tr '[:upper:]' '[:lower:]')
          SLUGGED_NAME=$(echo "${LOWER_CASE_NAME}" | sed -E 's/[[:space:]]+/-/g')
          FINAL_SLUG=$(echo "${SLUGGED_NAME}" | sed -E 's/[^a-z0-9_-]+//g')

          NEW_BRANCH_NAME="${BRANCH_TYPE}/${ISSUE_NUMBER}-${FINAL_SLUG}"

          echo "Create branch: ${NEW_BRANCH_NAME}"

          git checkout -b "${NEW_BRANCH_NAME}"
          git push origin "${NEW_BRANCH_NAME}"

      - name: Update issue title
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'update-issue'
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          title: '[${{ steps.resolve-issue-key.outputs.ISSUE_KEY }}] ${{ github.event.issue.title }}'
          body: |
            ${{ github.event.issue.body }}
            
            ### 연결된 Jira 이슈 (Related Jira Issue)
            [${{ steps.resolve-issue-key.outputs.ISSUE_KEY }}](${{ secrets.JIRA_BASE_URL }}/browse/${{ steps.resolve-issue-key.outputs.ISSUE_KEY }})