name: Build and Push API Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: checkout@v4

      - name: Set up JDK 21
        uses: setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t sickofu/bandchu-api:latest .

      - name: Push Docker image
        run: |
          docker push sickofu/bandchu-api:latest

      # [최종 CD 배포 단계]
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: lemon
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          script: |
            # 1. 작업 경로로 이동
            cd ~/bandchu/docker
            
            # 2. 최신 이미지 Pull
            docker pull sickofu/bandchu-api:latest
            
            # 3. 컨테이너 재시작 (이미지 교체 및 실행)
            # --remove-orphans는 더 이상 쓰이지 않는 옛날 컨테이너를 정리해줍니다.
            docker compose up -d --remove-orphans
            
            # 4. 안 쓰는 이전 이미지들 정리 (용량 관리)
            docker image prune -f
