name: 'Create new Issue'
description: '새로운 이슈를 생성합니다. 생성된 이슈는 Jira와 연동되며, 자동으로 이슈 기반 브랜치를 생성합니다.'
title: '[Feature/Fix/Refactor] 이슈 제목'
body:
  - type: dropdown
    id: branchType
    attributes:
      label: '브랜치 유형 (Branch Type)'
      description: '작업 성격에 맞는 브랜치 유형을 선택하세요.'
      options:
        - feature
        - fix
        - refactor
    validations:
      required: true

  - type: input
    id: branchName
    attributes:
      label: '브랜치 이름 (Branch Name)'
      description: '작업에 어울리는 브랜치 이름을 지어주세요'
      placeholder: 'member-register'
    validations:
      required: true

  - type: input
    id: epicKey
    attributes:
      label: '상위 티켓 (Epic Key)'
      description: '부모 에픽 키를 입력하세요. 비워두면 에픽에 연결하지 않습니다.'
      placeholder: 'BC-123'

  - type: input
    id: description
    attributes:
      label: '이슈 내용 (Description)'
      description: '작업할 이슈에 대해 설명해 주세요'

  - type: textarea
    id: tasks
    attributes:
      label: '작업 목록 (Tasks)'
      description: '해당 이슈에 대해 필요한 작업 목록을 작성해주세요'
      value: |
        - [ ] Task1
        - [ ] Task2