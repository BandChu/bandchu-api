input {
  file {
    path => "/app/logs/bandchu-api.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}

filter {
  # timestamp 파싱
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # 불필요한 필드 제거
  mutate {
    remove_field => ["host", "@version"]
  }

  # ERROR 레벨 태깅
  if [level] == "ERROR" {
    mutate {
      add_tag => ["error"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bandchu-api-%{+YYYY.MM.dd}"
  }
}
