spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        provider:
          google:
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # JSON 요청 크기 제한 (base64 데이터 URL 저장을 위해 증가)
  http:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

server:
  # HTTP 요청 크기 제한 (base64 데이터 URL 저장을 위해 증가)
  max-http-header-size: 1MB
  max-http-post-size: 10MBㄴ

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}


aws:
  region: ap-northeast-2
  s3:
    bucket: bandchu-bucket
  credentials:
    accessKey: ${AWS_CREDENTIAL_ACCESS_KEY}
    secretKey: ${AWS_CREDENTIAL_SECRET_KEY}
    client-id: ${GOOGLE_CLIENT_ID}

flyway:
  enabled: true
  # 기존에 테이블이 이미 있는 상태라면 true로 설정하여 시작점을 잡습니다.
  baseline-on-migrate: true
  # 마이그레이션 파일 위치 (기본값)
  locations: classpath:db/migration
  # 만약 특정 스키마를 지정하고 싶다면 (기본값은 public)
  schemas: public

  jpa:
    hibernate:
      # 중요: Flyway 사용 시에는 validate 또는 none을 권장합니다.
      ddl-auto: validate
