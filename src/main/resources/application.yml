spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        provider:
          google:
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    bcrypt:
      # BCrypt 워크 팩터 설정 (4-31, 기본값: 10)
      # 값이 높을수록 해시 계산 시간이 길어져 보안이 강화되지만, 응답 시간도 증가
      # 권장값: 10 (일반), 12-14 (높은 보안), 4-9 (개발/테스트)
      strength: 10

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # JSON 요청 크기 제한 (base64 데이터 URL 저장을 위해 증가)
  http:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

server:
  # HTTP 요청 크기 제한 (base64 데이터 URL 저장을 위해 증가)
  max-http-header-size: 1MB
  max-http-post-size: 10MB

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000  # 1시간
  refresh-token-expiration: 604800000  # 7일

aws:
  region: ap-northeast-2
  s3:
    bucket: bandchu-bucket
  credentials:
    accessKey: ${AWS_CREDENTIAL_ACCESS_KEY}
    secretKey: ${AWS_CREDENTIAL_SECRET_KEY}
    client-id: ${GOOGLE_CLIENT_ID}
