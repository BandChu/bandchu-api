spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        provider:
          google:
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}