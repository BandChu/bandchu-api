spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 🔴 아래 flyway와 jpa 설정이 spring 하위로 정확히 정렬되어야 합니다.
  flyway:
    enabled: true
    baseline-on-migrate: true # 기존 DB가 있어도 기준점을 잡고 시작함
    locations: classpath:db/migration
    schemas: public

  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        provider:
          google:
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    bcrypt:
      strength: 10

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  http:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

server:
  port: 8080
  max-http-header-size: 1MB
  max-http-post-size: 10MB

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

aws:
  region: ap-northeast-2
  s3:
    bucket: bandchu-bucket
  credentials:
    accessKey: ${AWS_CREDENTIAL_ACCESS_KEY}
    secretKey: ${AWS_CREDENTIAL_SECRET_KEY}

# 🔴 JWT 설정은 최상위에 두어도 JwtService에서 @Value로 읽어갑니다.
jwt:
  secret: ${JWT_SECRET}