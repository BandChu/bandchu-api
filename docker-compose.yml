services:
  api:
    image: mingdodev/bandchu-api:1.0.0
    platform: linux/amd64
    container_name: bandchu-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env
    volumes:
      - ./data/docker/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  nginx:
    image: nginx:1.29.3
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
